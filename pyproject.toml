[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grounded-spreadsheet-agent"
version = "0.1.0"
description = "Stage-isolated spreadsheet code policies with execution-consistency selection"
requires-python = ">=3.11"
dependencies = ["openpyxl==3.1.5", "openai>=1.30,<4", "httpx>=0.27,<1", "tqdm>=4.66"]

[tool.setuptools.packages.find]
where = ["src"]
